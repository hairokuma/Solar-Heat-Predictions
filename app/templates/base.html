<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solar Heat Predictions{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.dashboard') }}">Solar Heat Predictions</a>
    <nav>
      <a href="{{ url_for('web.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('web.new_reading') }}">Log reading</a>
      <a href="{{ url_for('web.list_transfers') }}">Transfers</a>
      <a href="{{ url_for('web.roadmap') }}">Roadmap</a>
      <a href="{{ url_for('web.settings_form') }}">Settings</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
