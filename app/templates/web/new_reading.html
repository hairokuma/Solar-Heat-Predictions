{% extends "base.html" %}
{% block content %}
<h1>Log a reading</h1>
<form method="post" action="{{ url_for('web.create_reading') }}">
  <label>Location
    <select name="location" required>
      {% for loc in locations %}
        <option value="{{ loc }}" {% if form and form.get('location') == loc %}selected{% endif %}>{{ loc|capitalize }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Temperature (°C)
    <input type="number" step="0.1" name="value_c" value="{{ form.value_c if form else '' }}" required>
  </label>
  <label>Timestamp (leave blank for now)
    <input type="datetime-local" name="recorded_at" value="{{ form.recorded_at if form else '' }}">
  </label>
  <div class="wizard-actions">
    <a href="{{ url_for('web.dashboard') }}">Cancel</a>
    <button type="submit">Save</button>
  </div>
</form>
{% endblock %}
